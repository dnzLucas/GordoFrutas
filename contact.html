<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Gordo Frutas</title>
    <link rel="stylesheet" href="src/css/reset.css">
    <link rel="stylesheet" href="src/css/contact.css">
</head>

<body>
   <header>
      <nav aria-label="Menu principal">
        <a href="index.html">
          <img src="src/img/logo.png" class="logo" />
        </a>
        <ul>
          <li><a href="fruits.html">Frutas</a></li>
          <li><a href="about.html">Sobre</a></li>
          <li><a href="contact.html">Contato</a></li>
        </ul>
      </nav>
    </header> 
    <main>
        <section class="contato">
            <div class="lado-esquerdo">
                <h1>Frutas frescas, qualidade e sabor todos os dias.
                    Entre em contato com nossa equipe e teremos prazer em atender você!
                </h1>
            </div>
            <form class="lado-direito">

                <div class="campo">
                    <input type="text" id="nome" required>
                    <label for="nome">Nome</label>
                </div>
                <div class="campo">
                    <input type="email" id="email" required>
                    <label for="email">E-mail</label>
                </div>
                <div class="campo">
                    <input type="tel" id="telefone" required>
                    <label for="telefone">Telefone</label>
                </div>

                <div class="campo">
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem"></textarea>
                </div>

                <button type="submit" class="enviar">
                    ENVIAR MENSAGEM
                </button>
            </form>
        </section>
        <article class="loja">
            <h1>Conheça nossa loja</h1>
        </article>
        <div class="local">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d114505.72435379567!2d-49.00781530273434!3d-26.251799!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94deafa479f2814f%3A0x2478f66c31fd2343!2sUNIVILLE%20-%20JOINVILLE%20REGION%20UNIVERSITY%20(FURJ)!5e0!3m2!1sen!2sbr!4v1779065468355!5m2!1sen!2sbr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
    </main>

    <footer>
        <p>
            2026 Gordo Frutas. Frescor, qualidade e sabor em cada detalhe.
        </p>
    </footer>
</body>

</html>
