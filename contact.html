<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Gordo Frutas</title>
    <link rel="stylesheet" href="src/css/reset.css">
    <link rel="stylesheet" href="src/css/contact.css">
</head>

<body>
    <header>
        <nav class="Menu-principal">
            <ul class="menu">
                <li><a class="opcao" href="index.html">Home</a></li>
                <li><a class="opcao" href="about.html">Sobre</a></li>
                <li><a class="opcao" href="fruits.html">Frutas</a></li>
                <li><a class="opcao" href="contact.html">Contato</a></li>
            </ul>

            <img src="src/img/logo.png" alt="Logo da Gordo Frutas" class="logo" />

        </nav>
    </header>
    <main>
        <section class="contato">
            <div class="lado-esquerdo">
                <img src="src/img/contact-background.jpg" alt="Imagem de frutas frescas" class="imagem-frutas">
                <h1>Frutas frescas, qualidade e sabor todos os dias.
                    Entre em contato com nossa equipe e teremos prazer em atender você!
                </h1>
            </div>

            <form class="lado-direito">

                <div class="campo">
                    <input type="text" id="nome" required>
                    <label for="nome">Nome</label>
                </div>
                <div class="campo">
                    <input type="email" id="email" required>
                    <label for="email">E-mail</label>
                </div>
                <div class="campo">
                    <input type="tel" id="telefone" required>
                    <label for="telefone">Telefone</label>
                </div>

                <div class="campo">
                    <input type="text" id="mensagem">
                    <label for="mensagem">Mensagem</label>
                </div>

                <button type="submit" class="enviar">
                    ENVIAR MENSAGEM
                </button>

            </form>
        </section>
        <article class="loja">
            <h1>Conheça nossa loja</h1>
            <a href="about.html">Sobre</a>
        </article>
    </main>

    <footer>
        <p>
            2026 Gordo Frutas. Frescor, qualidade e sabor em cada detalhe.
        </p>
    </footer>
</body>

</html>
