<aside aria-label="Filtros de frutas">
  <h2>Filtros</h2>

  <form (submit)="$event.preventDefault(); applyFilters()">
    <div class="filterBox">
      <h3>Pesquisar</h3>

      <label for="searchFruit"> Buscar fruta </label>

      <input
        type="text"
        id="searchFruit"
        name="searchFruit"
        placeholder="Buscar fruta..."
        [value]="searchTerm()"
        (input)="onSearchInput($event)"
      />
    </div>

    <div class="filterBox" id="fruitTypes">
      <h3>Tipos de fruta</h3>

      @for (category of categoryOptions; track category.value) {
        <label [for]="category.value">
          <input
            type="checkbox"
            [id]="category.value"
            [name]="category.value"
            [checked]="isCategorySelected(category.value)"
            (change)="onCategoryToggle(category.value, $event)"
          />
          {{ category.label }}
        </label>
      }
    </div>

    <div class="filterBox" id="priceRange">
      <h3>Preço</h3>

      <label for="price"> Faixa de preço (até R$ {{ maxPrice() }}) </label>

      <input
        type="range"
        id="price"
        name="price"
        [min]="priceRangeMin"
        [max]="priceRangeMax"
        [value]="maxPrice()"
        (input)="onPriceRangeInput($event)"
      />

      <div id="minAndMaxInputs">
        <label for="minPrice"> Valor mínimo </label>

        <input
          type="number"
          id="minPrice"
          name="minPrice"
          placeholder="Mín"
          [min]="priceRangeMin"
          [max]="priceRangeMax"
          [value]="minPrice()"
          (input)="onMinPriceInput($event)"
        />

        <label for="maxPrice"> Valor máximo </label>

        <input
          type="number"
          id="maxPrice"
          name="maxPrice"
          placeholder="Máx"
          [min]="priceRangeMin"
          [max]="priceRangeMax"
          [value]="maxPrice()"
          (input)="onMaxPriceInput($event)"
        />
      </div>
    </div>

    <div class="filterBox">
      <h3>Disponibilidade</h3>

      <label for="stock">
        <input
          type="checkbox"
          id="stock"
          name="stock"
          [checked]="onlyInStock()"
          (change)="onStockToggle($event)"
        />
        Em estoque
      </label>

      <label for="promo">
        <input
          type="checkbox"
          id="promo"
          name="promo"
          [checked]="onlyPromo()"
          (change)="onPromoToggle($event)"
        />
        Promoção
      </label>
    </div>

    <div id="filterButtons">
      <button type="submit">Aplicar filtros</button>

      <button type="button" (click)="clearFilters()">Limpar filtros</button>
    </div>
  </form>
</aside>
